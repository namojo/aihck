[project]
name = "clausetower"
version = "0.1.0"
description = "ClauseTower — 계약 조항을 읽어 페널티 노출액 순서로 배차하는 물류 관제 에이전트"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
clausetower = "clausetower.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clausetower = ["prompts/*.md", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
