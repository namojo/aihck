  typhoon: {has_clause: true, event_covered: true, notice_ok: false, applies: false, reasoning: "태풍은 천재지변으로 면제 사유에 해당한다. 그러나 제14조 제2항은 12시간 이내 서면 통지를 요구하는데 운영팀은 발생 20시간 뒤에 통지했으므로 면제를 주장하지 못한다."}
