<!doctype html>
<html lang="ko">
<head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFP Compass</title>
<style>
:root{--navy:#1B2A49;--navy2:#2E4A7D;--accent:#E8622A;--bg:#F4F6FA;--card:#fff;--line:#DDE3EC;--text:#1F2937;--muted:#6B7280;
 --high:#C0392B;--high-bg:#FDECEA;--med:#B7791F;--med-bg:#FFF6E0;--low:#4B5563;--low-bg:#EEF0F3;--ok:#1E7F4F;--ok-bg:#E6F4EC;}
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text);font-size:14px}
header{background:var(--navy);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:16px}
header .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;font-weight:800}
header h1{font-size:18px;margin:0;font-weight:700}header .sub{opacity:.75;font-size:12px;margin-left:4px}
header .mode{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:999px}
main{max-width:1280px;margin:0 auto;padding:22px 28px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
h2{font-size:16px;margin:0 0 12px}h3{font-size:14px;margin:0 0 8px;color:var(--navy2)}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
button,.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit}
button.secondary{background:#fff;color:var(--navy);border:1px solid var(--navy)}button.accent{background:var(--accent)}
button:disabled{opacity:.5;cursor:default}
input[type=file]{font-size:12px}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);flex:1;min-width:280px;background:#FAFBFD}
.dropzone b{color:var(--navy);display:block;font-size:15px;margin-bottom:4px}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:14px}
.step{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;position:relative}
.step .n{font-size:11px;color:var(--muted)}.step .name{font-weight:700;margin:2px 0}.step .st{font-size:12px;color:var(--muted)}
.step.running{border-color:var(--accent);box-shadow:0 0 0 2px rgba(232,98,42,.15)}.step.running .st{color:var(--accent)}
.step.done{border-color:var(--ok)}.step.done .st{color:var(--ok)}.step.skipped{opacity:.5}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.step.done .bar i{background:var(--ok);width:100%}
.timer{font-variant-numeric:tabular-nums;font-size:26px;font-weight:800;color:var(--navy)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .k{font-size:12px;color:var(--muted)}.tile .v{font-size:28px;font-weight:800;color:var(--navy);margin:2px 0}.tile .d{font-size:12px;color:var(--muted)}
.tile.red .v{color:var(--high)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px}
.tab{padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:600;color:var(--muted)}
.tab.active{color:var(--navy);border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;background:#fff}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
select,input[type=search]{font-family:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th{background:#F0F3F8;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--navy2);position:sticky;top:0}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr.clickable{cursor:pointer}tr.clickable:hover td{background:#F7F9FC}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700;white-space:nowrap}
.b-table{background:#E8EEF8;color:var(--navy2)}.b-prose{background:#FDE7D8;color:#9A3D12}.b-must{background:#E6F4EC;color:var(--ok)}.b-should{background:#EEF0F3;color:#4B5563}.b-may{background:#EEF0F3;color:#6B7280}
.b-high{background:var(--high-bg);color:var(--high)}.b-medium{background:var(--med-bg);color:var(--med)}.b-low{background:var(--low-bg);color:var(--low)}
.b-covered{background:var(--ok-bg);color:var(--ok)}.b-partial{background:var(--med-bg);color:var(--med)}.b-missing{background:var(--high-bg);color:var(--high)}
.b-cat{background:#F0F3F8;color:var(--navy2)}
.quote{color:#374151}.muted{color:var(--muted);font-size:12px}
.risk{border:1px solid var(--line);border-left:5px solid var(--low);border-radius:10px;padding:14px 16px;margin-bottom:12px;background:#fff}
.risk.high{border-left-color:var(--high)}.risk.medium{border-left-color:var(--med)}
.risk .head{display:flex;gap:10px;align-items:center;margin-bottom:6px}.risk .head b{font-size:15px}
.risk .vals{display:flex;gap:10px;margin:8px 0;flex-wrap:wrap}.risk .val{background:#F7F9FC;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
.risk .val b{display:block;font-size:14px;color:var(--navy)}.risk .val.bad b{color:var(--high)}
.risk blockquote{margin:8px 0;padding:8px 12px;background:#FAFBFD;border-left:3px solid var(--line);font-size:13px}
.risk .neg{background:var(--ok-bg);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:6px}
.toc .node{display:grid;grid-template-columns:60px 1fr 160px 90px;gap:12px;padding:10px 8px;border-bottom:1px solid var(--line);align-items:center}
.toc .node.l2{padding-left:30px;background:#FAFBFD}.toc .num{font-weight:800;color:var(--navy)}.toc .ptsbar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.toc .ptsbar i{display:block;height:100%;background:var(--navy2)}
.toc .guide{font-size:12px;color:var(--muted);margin-top:3px}.toc .ids{font-size:11px;color:var(--navy2);margin-top:3px}
.cov-bars{display:flex;height:22px;border-radius:8px;overflow:hidden;margin:6px 0 14px;font-size:12px;color:#fff;font-weight:700}
.cov-bars div{display:grid;place-items:center}.cov-bars .c{background:var(--ok)}.cov-bars .p{background:var(--med)}.cov-bars .m{background:var(--high)}
.drawer{position:fixed;top:0;right:-560px;width:540px;height:100%;background:#fff;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.08);transition:right .25s;padding:20px 22px;overflow:auto;z-index:50}
.drawer.open{right:0}.drawer pre{white-space:pre-wrap;font-family:inherit;font-size:13px;line-height:1.6;background:#FAFBFD;padding:14px;border-radius:10px;border:1px solid var(--line)}
.drawer mark{background:#FFE58A;padding:0 2px}
.drawer .close{float:right}
.alert{background:var(--high-bg);color:var(--high);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.hidden{display:none}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
@media (max-width:900px){.steps{grid-template-columns:repeat(3,1fr)}.tiles{grid-template-columns:repeat(2,1fr)}.drawer{width:100%;right:-100%}}
</style>
</head>
<body>
<header><div class="logo">R</div><h1>RFP Compass</h1><span class="sub">300쪽 제안요청서를 읽는 제안 검토 에이전트</span><span class="mode" id="mode">—</span></header>
<main>
  <section class="card" id="intake">
    <h2>1. RFP 올리기</h2>
    <div class="row">
      <label class="dropzone"><b>RFP PDF를 선택하세요</b><span id="pdfName">PDF 1건 (나라장터 공고문, 제안요청서)</span><input type="file" id="pdf" accept="application/pdf" class="hidden"></label>
      <label class="dropzone"><b>제안서 초안 (선택)</b><span id="draftName">.md 또는 .docx — 있으면 요구사항 커버리지를 대조합니다</span><input type="file" id="draft" accept=".md,.docx,.txt" class="hidden"></label>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="run" class="accent">검토 시작</button>
      <button id="sample" class="secondary">샘플 RFP로 시작</button>
      <label class="muted"><input type="checkbox" id="withDraft" checked> 샘플 초안 포함(커버리지)</label>
      <span class="muted" id="hint"></span>
    </div>
  </section>

  <section class="card hidden" id="progress">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">2. 검토 진행</h2><div class="timer" id="timer">00:00.0</div></div>
    <div class="steps" id="steps"></div>
    <div class="muted" id="log" style="margin-top:10px"></div>
  </section>

  <section id="results" class="hidden">
    <div class="tiles" id="tiles"></div>
    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <h2 style="margin:0" id="rfpTitle"></h2>
        <div class="row" id="downloads"></div>
      </div>
      <div class="tabs">
        <div class="tab active" data-tab="req">요구사항 추적표</div>
        <div class="tab" data-tab="risk">위험 조항</div>
        <div class="tab" data-tab="toc">배점 기준 목차</div>
        <div class="tab" data-tab="cov">초안 커버리지</div>
      </div>
      <div id="pane-req"></div>
      <div id="pane-risk" class="hidden"></div>
      <div id="pane-toc" class="hidden"></div>
      <div id="pane-cov" class="hidden"></div>
    </div>
  </section>
  <footer>RFP Compass · 결과의 모든 항목은 원문 인용과 쪽 번호를 가진다. 클릭하면 원문을 연다. 데모 데이터는 가상의 기관·사업이다.</footer>
</main>
<aside class="drawer" id="drawer"><button class="secondary close" onclick="closeDrawer()">닫기</button><h3 id="dTitle"></h3><div class="muted" id="dMeta"></div><pre id="dText"></pre></aside>

<script>

 범위를 넘어 추가 개발을 대가 없이 요구하는 조항입니다. 같은 조에 3년 하자보수 의무가 따로 있고 상한·예외·협의 절차 같은 완화 장치가 없어 기본 심각도 high를 유지합니다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"계약상대자는 하자보수 기간 중 하자에 대해서만 무상으로 보수하며, 검수 완료 후 유지보수와 기능 개선은 「소프트웨어 진흥법」과 과기정통부 지침에 따라 별도 유상 유지보수 계약(유지보수 요율 적용)으로 체결한다\"로 수정해 줄 것을 요청합니다.", "basis": "과학기술정보통신부 소프트웨어사업 계약 및 관리감독에 관한 지침(무상 유지보수 요구 금지)", "source": "rule+llm"}, {"rule_id": "R05_unilateral_scope_change", "title": "과업 범위 일방 변경 조항", "category": "과업범위", "severity": "high", "quote": "발주기관이 필요하다고 인정하는 경우 과업 내용을 추가 또는 변경할 수 있으며 계약상대자는 이에 따라야 한다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "발주기관이 필요하다고 판단만 하면 과업을 추가·변경할 수 있고 수행사는 따라야 한다고 되어 있습니다. 그런데 문맥 어디에도 과업심의위원회 심의, 계약금액·기간 조정, 협의 절차가 없어 소프트웨어 진흥법 제50조의 취지와 맞지 않으므로 기본 심각도 high를 그대로 둡니다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"과업 내용의 추가 또는 변경은 소프트웨어 진흥법 제50조에 따른 과업심의위원회의 심의를 거쳐 계약상대자와 협의하여 정하며, 이에 따라 증가하는 비용과 기간은 계약금액 및 계약기간 조정에 반영한다\"로 수정해 줄 것을 요구합니다.", "basis": "소프트웨어 진흥법 제50조(과업심의위원회) 및 같은 법 시행령", "source": "rule+llm"}, {"rule_id": "R07_liability_cap_missing", "title": "손해배상 상한 미설정", "category": "계약조건", "severity": "high", "quote": "계약상대자는 과업 수행 중 고의 또는 과실로 발주기관에 손해를 끼친 경우 그 모든 손해를 배상하여야 한다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "손해배상 조항에 배상 상한이 없고, 경과실까지 '그 모든 손해'를 배상하도록 되어 있습니다. 간접손해나 특별손해를 빼는 문구도, 발주기관 귀책 시 감면하는 문구도 없어 기본 심각도 high를 그대로 유지합니다(추출값 -, 기준값 -). 같은 문맥의 개인정보 조항(11항)은 '원인을 불문하고' 모든 책임을 지우고 있어, 무한책임 위험이 더 커집니다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"계약상대자의 손해배상 책임은 고의 또는 중과실의 경우를 제외하고 계약금액을 한도로 하며, 간접손해·특별손해·일실이익은 배상 범위에서 제외한다. 발주기관의 귀책사유가 함께 있는 경우 그 비율에 따라 배상액을 감경한다\"로 수정해 줄 것을 요청합니다.", "basis": "계약예규 용역계약일반조건 손해배상 조항. 상한 관행은 팀이 확인할 것", "source": "rule+llm"}, {"rule_id": "R14_privacy_liability_shift", "title": "개인정보 책임 전가", "category": "보안", "severity": "high", "quote": "계약상대자는 개인정보 보호법을 준수하여야 하며 개인정보 유출 사고 발생 시 원인을 불문하고 모든 책임은 계약상대자가 부담한다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "'원인을 불문하고 모든 책임'을 계약상대자에게 tle": "하자담보책임 기간 과다", "category": "계약조건", "severity": "high", "quote": "하자보수 기간은 검수 완료일로부터 3년으로 한다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "하자보수 기간이 검수 완료일부터 3년(추출값)으로 기준값 1년의 3배입니다. 상한, 예외, 협의 절차 같은 완화 문구가 없고, 바로 뒤에 2년 무상 유지보수와 기능 개선 대응 의무가 함께 붙어 있어 실제 부담이 더 큽니다. 그래서 기본 심각도 medium을 high로 올렸습니다.", "extracted_value": "3년", "threshold": "1년", "negotiation_point": "\"하자담보책임기간은 검수 완료일로부터 1년으로 하며, 하자의 범위는 계약 당시 과업 범위 내 결함으로 한정한다. 기능 개선 요청은 하자보수에 포함하지 않으며 별도 유지보수 계약 또는 과업변경 절차에 따른다.\"로 수정해 달라고 요구합니다.", "basis": "소프트웨어 진흥법 및 계약예규 용역계약일반조건의 하자담보 조항. 팀이 최신 조문으로 확인할 것", "source": "rule+llm"}, {"rule_id": "R06_ip_sole_ownership", "title": "산출물 지식재산권 발주기관 단독 귀속", "category": "지식재산", "severity": "high", "quote": "본 사업의 모든 산출물에 대한 지식재산권은 발주기관에 귀속된다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "산출물 지식재산권을 예외 없이 모두 발주기관에 귀속시키고, 사전 서면 동의 없이 제3자에게 제공하는 것도 막고 있습니다. 기존 보유 기술, 공통 모듈, 상용 소프트웨어를 빼주는 조항이나 공동 귀속·활용 허락 조항이 없어 소프트웨어 진흥법 제59조와 용역계약일반조건 제56조의 공동 귀속 원칙에서 벗어나므로, 기본값 medium보다 높은 high로 올렸습니다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"산출물의 지식재산권은 용역계약일반조건 제56조에 따라 발주기관과 계약상대자가 공동 소유하되, 계약상대자가 사업 전부터 보유한 기술·공통 모듈·상용 소프트웨어 및 그 개선물은 계약상대자에게 귀속되고 발주기관에는 사업 목적 범위의 무상 사용권을 허락한다\"로 수정을 요청합니다.", "basis": "소프트웨어 진흥법 제59조(소프트웨어사업 산출물의 활용 보장) 및 계약예규 용역계약일반조건 제56조(계약목적물의 지식재산권 귀속)", "source": "rule+llm"}, {"rule_id": "R09_payment_terms", "title": "대금 지급 조건 불리", "category": "대금지급", "severity": "high", "quote": "사업비는 최종 검수 완료 후 일괄 지급하며 선금은 지급하지 아니한다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "선금과 기성금이 전혀 없어 사업 기간 내내 인건비와 상용 SW 비용을 수행사가 먼저 부담해야 합니다. 검수를 발주기관이 만족할 때까지 반복하고(8항), 언제든 해지하면서 기투입 비용을 보상하지 않는다(15항)는 조항까지 겹쳐 대금을 한 푼도 못 받을 위험이 있으므로 기본값 medium에서 high로 올립니다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"계약상대자가 청구하면 국가계약법령과 정부 입찰·계약 집행기준에 따라 계약금액의 70% 범위에서 선금을 지급하고, 단계별 산출물 검수(분석·설계·구현·이행)가 끝나면 시행령 제58조에 따라 기성 대가를 지급한다\"로 바꿔 달라고 요구합니다.", "basis": "국가계약법 시행령 제58조(기성 대가의 지급), 정부 입찰·계약 집행기준 선금 조항", "source": "rule+llm"}, {"rule_id": "R10_vague_acceptance", "title": "검수 기준 모호", "category": "검수", "severity": "high", "quote": "검수는 발주기관이 만족할 때까지 반복 수행하며 검수 기간은 계약 기간에 포함된다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "검수 종료 기준이 '발주기관이 만족할 때까지'로 되어 있어 객관적 합격 기준이 없고, 검수 기간이 계약 기간에 포함되므로 반복 검수가 길어지면 지체상금(1일 계약금액의 2.5/1000, 상한 없음)이 붙을 수 있습니다. 대금도 최종 검수 완료 후 일괄 지급(선금 없음)이라 검수가 지연되는 동안 대금 회수가 막히고 지체상금까지 겹치므로, 기본값 medium에서 high로 올렸습니다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"검수는 착수 시 발주기관과 계약상대자가 합의한 검수 기준서(요구사항 추적표 및 시험 시나리오)에 따라 수행하고, 발주기관은 납품일로부터 14일 이내에 합격 여부를 서면으로 통지한다. 기간 내 통지가 없으면 합격으로 본다. 보완 요구는 검수 기준서에 정한 항목으로 한정하며, 검수 및 보완에 걸린 기간은 지체 일수에서 제외한다.\"", "basis": "소프트웨어사업 관리감독 지침의 검사 기준 조항", "source": "rule+llm"}, {"rule_id": "R11_staffing_control", "title": "투입 인력 통제 조항", "category": "인력", "severity": "high", "quote": "참여 인력의 교체는 불가하며 전 인력은 사업 기간 동안 발주기관에 상주하여야 한다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "이 조항은 인력 교체를 예외 없이 막고 전 인력에게 사업 기간 내내 상주를 요구합니다. 협의 절차나 퇴사·질병 같은 불가피한 사유의 예외가 없어 지킬 수 없는 의무가 되고, 소프트웨어사업 관리감독 지침의 투입인력 관리 금지 원칙에도 어긋나므로 기본값(medium)보다 높은 high로 올렸습니다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"계약상대자는 퇴직·질병·휴직 등 불가피한 사유가 있으면 발주기관과 협의하여 동등 이상의 자격을 갖춘 인력으로 교체할 수 있다. 작업 장소는 과업 특성을 고려하여 원격 수행을 포함해 협의로 정하며, 발주기관은 투입 인력의 상주나 인원 관리를 일방적으로 요구하지 않는다.\"로 수정해 줄 것을 요청합니다.", "basis": "소프트웨어 진흥법 시행령 및 소프트웨어사업 관리감독 지침(투입인력 관리 금지 원칙)", "source": "rule+llm"}, {"rule_id": "R12_free_commercial_sw", "title": "상용 소프트웨어 무상 제공 요구", "category": "과업범위", "severity": "high", "quote": "운영에 필요한 상용 소프트웨어 라이선스는 사업자가 무상으로 제공한다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "\"운영에 필요한\" 상용SW 전체(DBMS·WAS·보안SW 등)를 품목·수량·라이선스 기간·금액 상한 없이 무상 제공하도록 했고, 분리발주나 별도 예산 반영 같은 완화 장치도 없습니다. 소프트웨어 진흥법 제54조의 분리발주 취지에도 어긋납니다. 여기에 과업 변경 의무 수용(3항), 2년 무상 유지보수(2항), 선금 없는 일괄 지급(7항)이 겹쳐 라이선스와 갱신 비용이 계속 늘어날 수 있으므로 기본값 medium을 high로 올렸습니다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"운영에 필요한 상용 소프트웨어는 소프트웨어 진흥법 제54조에 따라 분리발주하거나, 제안요청서 별첨 목록에 적힌 품목·수량·라이선스 기간에 한해 사업금액에 반영해 제공한다. 목록 밖의 품목과 과업 변경으로 추가되는 라이선스, 기술지원 갱신 비용은 발주기관이 부담하거나 계약금액을 조정한다.\"로 바꿔 달라고 요구한다.", "basis": "소프트웨어 진흥법 제54조(소프트웨어사업의 분리 발주)", "source": "rule+llm"}, {"rule_id": "R15_sla_penalty", "title": "성능 수치와 위약 조항 결합", "category": "성능", "severity": "medium", "quote": "서비스 개시 후 안정화 기간 중 일반 조회 화면의 평균 응답 시간이 3초를 초과하는 월에는 해당 월 대금의 5%를 감액한다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "조항에는 응답시간 3초(평균)를 넘는 달마다 그 달 대금의 5%를 감액한다고만 되어 있고, 측정 방법·대상 화면·안정화 기간의 길이·누적 감액 상한·면책 사유(발주기관 인프라 문제, 외부 연계 장애 등)가 정해져 있지 않습니다. 게다가 제7항에서 대금을 최종 검수 후 한 번에 지급하므로 '해당 월 대금'이 얼마인지도 불분명합니다. 완화 조항도 없지만 3초와 5%가 지나친 수준은 아니어서 기본 심각도 medium을 유지했습니다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"응답시간은 발주기관과 합의한 측정 도구·대상 화면·부하 조건에서 월 평균으로 측정하며, 발주기관 제공 인프라·네트워크·외부 연계기관 장애나 불가항력으로 생긴 지연은 측정에서 제외한다. 감액 기준 금액은 '계약금액 ÷ 계약 개월 수'로 산정하고, 누적 감액 총액은 계약금액의 ○%를 넘지 않는다.\"", "basis": "정보시스템 서비스 수준 관리(SLA) 가이드", "source": "rule+llm"}, {"rule_id": "R16_third_party_integration", "title": "제3자 연계 책임 전가", "category": "과업범위", "severity": "high", "quote": "외부 연계 기관의 비협조로 연계 구축이 지연되더라도 그 책임은 사업자가 부담한다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "수행사가 통제할 수 없는 외부 연계 기관의 비협조까지 예외 없이 사업자 책임으로 돌리며, 계약예규상 계약상대자 책임이 아닌 사유로 인정되는 기간 연장이나 협의 절차 같은 완화 장치가 문맥 어디에도 없습니다. 같은 계약에 검수 기간이 계약 기간(10개월)에 포함되고, 최종 검수 후 일괄 지급하며, 발주기관이 보상 없이 해지할 수 있다는 조건이 함께 있습니다. 이 때문에 연계 지연이 곧바로 지체상금, 대금 미지급, 해지 위험으로 이어질 수 있어 기본값 medium에서 high로 올렸습니다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"외부 연계 기관의 비협조 또는 연계 기관 측 사정으로 연계 구축이 지연되는 경우, 이는 계약상대자의 책임 없는 사유로 보아 지체상금을 부과하지 않는다. 발주기관은 연계 기관과의 협조 요청·일정 조율을 주관하고, 지연 기간만큼 계약 기간을 연장하거나 해당 연계 범위를 조정한다.\"로 수정해 줄 것을 요청합니다.", "basis": "계약예규 용역계약일반조건 계약기간 연장 사유 조항", "source": "rule+llm"}, {"rule_id": "R17_data_migration_scope", "title": "데이터 이관·정제 범위 무제한", "category": "과업범위", "severity": "high", "quote": "기존 시스템 데이터 이관은 데이터 정제를 포함하여 전체를 사업자가 책임지고 수행한다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "이 조항은 데이터 이관과 정제 범위를 \"전체\"로 정해 놓았습니다. 그런데 대상 데이터 양, 품질 수준, 정제 기준이 없고, 원천 데이터 오류에 대한 발주기관 책임도 없어 과업 범위가 무제한으로 열려 있습니다. 같은 문맥의 '발주기관이 만족할 때까지 반복 검수'(8항)와 '최종 검수 후 일괄 지급·선금 없음'(7항) 조항이 겹쳐, 이관 작업이 길어지면 대금을 받지 못한 채 비용이 계속 늘어날 수 있습니다. 이 때문에 기본 심각도 medium을 high로 올렸습니다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"이관 대상 데이터의 범위(시스템·테이블·건수·기간)와 정제 기준은 착수 후 발주기관과 협의하여 확정한 데이터 이관계획서에 따르며, 원천 데이터의 오류 확인과 정제 기준 결정, 이관 결과 검증은 발주기관이 지원하고 책임진다. 확정된 범위를 넘는 이관·정제는 과업변경으로 처리하여 계약금액과 기간을 조정한다.\"", "basis": "소프트웨어사업 요구사항 분석·적용 가이드(데이터 요구사항 DAR)", "source": "rule+llm"}, {"rule_id": "R13_security_certification", "title": "보안 인증 보유 요구", "category": "보안", "severity": "low", "quote": "시스템은 한빛시가 지정하는 공공 클라우드 환경(G-클라우드 또는 민간 CSAP 인증 클라우드)에 구축하여야 한다.", "page": 5, "section": "2. 기능 요구사항", "why": "이 조항은 수행사에게 보안인증을 직접 요구하지 않습니다. 이미 CSAP 인증을 받은 G-클라우드나 민간 클라우드에 시스템을 구축하라는 내용이어서 인증 취득 부담은 크지 않으므로 기본 심각도 low를 유지합니다. 다만 '한빛시가 지정하는' 환경이 아직 확정되지 않았고, 클라우드 이용료와 구축 범위를 누가 부담하는지도 정해지지 않아 원가와 설계가 흔들릴 수 있습니다.", "extracted_value": null, "threshold": null, "negotiation_point": "대상 클라우드(G-클라우드 또는 특정 CSAP 인증 CSP)와 제공 서비스 범위(IaaS/PaaS)를 제안 전에 확정해 주십시오. 클라우드 이용료·회선·보안관제 비용은 발주기관이 부담하고 본 사업 범위에서 빠진다는 점을 과업지시서에 명시해 주십시오. 지정 환경이 바뀌어 추가 작업이 생기면 과업변경 대상으로 본다는 점도 함께 명시해 주십시오.", "basis": "공공기관 보안성 검토 지침, 클라우드컴퓨팅법 시행령(보안인증)", "source": "rule+llm"}, {"rule_id": "R13_security_certification", "title": "보안 인증 보유 요구", "category": "보안", "severity": "low", "quote": "도입하는 보안 솔루션은 CC 인증을 보유하여야 한다.", "page": 6, "section": "5. 인터페이스 요구사항", "why": "공공기관에 도입하는 정보보호제품에 CC 인증을 요구하는 것은 국가정보원 보안적합성 검증 체계에 따른 표준 요건이라 수행사에 특별히 불리하지 않습니다. 기본 심각도 low를 유지합니다. 다만 어떤 보안 솔루션을 도입하는지, 비용을 누가 내는지, CC 인증 제품이 없는 품목은 어떻게 하는지(보안기능 확인서·KCMVP로 대체할 수 있는지)가 정해져 있지 않아 제품 선정이 제한되고 원가가 늘 수 있습니다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"SER-005에서 도입 대상 보안 솔루션의 품목과 수량을 명시하고, 국내 CC 인증 제품이 없는 품목은 보안기능 확인서 또는 KCMVP 검증필 암호모듈 탑재 제품으로 대체할 수 있도록 해 주시기 바랍니다. 기관이 이미 보유한 보안 솔루션을 활용할 경우 신규 도입 의무에서 제외해 주시기 바랍니다.\"", "basis": "공공기관 보안성 검토 지침, 클라우드컴퓨팅법 시행령(보안인증)", "source": "rule+llm"}, {"rule_id": "R18_proposal_cost_and_ownership", "title": "제안 비용 미보상·제안서 귀속", "category": "입찰조건", "severity": "low", "quote": "제출된 제안서는 반환하지 아니하며 제안에 소요된 비용은 제안사가 부담한다.", "page": 9, "section": "Ⅳ. 제안서 작성 및 평가", "why": "공공 제안요청서에서 흔히 쓰는 조건이라 제안 비용을 수행사가 부담하는 것 자체의 위험은 낮으므로 기본 심각도(low)를 그대로 둔다. 다만 제안서를 돌려주지 않는다는 규정만 있고, 낙찰되지 못한 제안서의 내용을 다른 용도로 쓰지 않는다거나 지식재산권이 누구에게 있는지에 대한 규정이 없어 제안 아이디어가 유출되거나 무단으로 쓰일 여지가 있다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"제출된 제안서의 지식재산권은 제안사에 귀속되며, 발주기관은 제안서 내용을 평가 목적으로만 사용하고, 낙찰되지 못한 제안사가 요청하면 평가 종료 후 제안서를 반환하거나 폐기한다\"는 문구를 명시해 달라고 질의한다.", "basis": "공공기관 제안서 평가 관련 일반 조건", "source": "rule+llm"}, {"rule_id": "R20_eligibility_track_record", "title": "입찰 참가 자격 실적 요건", "category": "입찰조건", "severity": "low", "quote": "입찰 참가 자격은 소프트웨어사업자 신고를 마치고 최근 5년 이내 10억 원 이상 공공기관 정보시스템 구축 실적 2건 이상을 보유한 업체로 한다.", "page": 9, "section": "Ⅳ. 제안서 작성 및 평가", "why": "자격 요건은 '최근 5년 이내 10억 원 이상 공공기관 정보시스템 구축 실적 2건 이상'입니다. 국가계약법 시행령 제12조상 참가자격 제한에 해당하지만 공동수급(2개사 이내)이 허용되어 진입 장벽이 일부 낮아지므로 기본 심각도 low를 유지합니다. 다만 실적 합산 인정 기준과 '공공기관'·'정보시스템 구축'의 범위가 정해져 있지 않아, 자사 실적이 인정되는지 미리 확인해야 합니다.", "extracted_value": null, "threshold": null, "negotiation_point": "\"공동수급 시 구성원별 실적을 지분율과 관계없이 합산해 인정하는지, 금융기관·지방공기업 등 '공공기관'의 범위와 유지보수·고도화 사업이 '정보시스템 구축 실적'에 포함되는지, 실적 금액이 계약금액 기준인지 지분 해당액 기준인지 명확히 해 주시기 바랍니다.\"", "basis": "국가계약법 시행령 제12조(경쟁입찰의 참가자격)", "source": "rule+llm"}, {"rule_id": "LLM_free_maintenance_excess", "title": "과도한 하자보수 기간 및 기능 개선을 포함한 무상 유지보수", "category": "하자보수", "severity": "high", "quote": "하자보수 기간은 검수 완료일로부터 3년으로 한다. 또한 계약상대자는 검수 완료 후 2년간 무상 유지보수를 제공하여야 하며 이 기간 중 기능 개선 요청에 대응하여야 한다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "통상 1년 수준인 SW 하자담보 기간보다 긴 3년의 하자보수에 더해, 2년간 무상 유지보수와 기능 개선 대응까지 요구합니다. 대가 없이 추가 과업을 수행해야 하는 구조입니다.", "extracted_value": null, "threshold": null, "negotiation_point": "하자보수 기간은 검수 완료 후 1년으로 하고, 무상 유지보수는 하자 조치에 한정해 주십시오. 기능 개선은 별도 유상 계약 대상임을 명시해 주십시오.", "basis": "국가계약법 시행령 제60조, 소프트웨어사업 계약 및 관리감독에 관한 지침(하자담보책임기간)", "source": "llm"}, {"rule_id": "LLM_privacy_strict", "title": "개인정보 유출 원인 불문 전부 책임", "category": "책임", "severity": "high", "quote": "개인정보 유출 사고 발생 시 원인을 불문하고 모든 책임은 계약상대자가 부담한다.", "page": 10, "section": "Ⅴ.11 개인정보 보호", "why": "발주기관의 귀책이나 불가항력으로 생긴 사고까지 수행사가 무과실로 책임지는 구조입니다.", "extracted_value": null, "threshold": null, "negotiation_point": "개인정보 유출 책임은 계약상대자의 귀책사유가 있는 범위로 한정해 줄 것을 요청합니다.", "basis": null, "source": "llm"}, {"rule_id": "LLM_free_maintenance_enhancement", "title": "무상 유지보수 기간 중 기능 개선 대응 의무", "category": "하자·유지보수", "severity": "high", "quote": "계약상대자는 검수 완료 후 2년간 무상 유지보수를 제공하여야 하며 이 기간 중 기능 개선 요청에 대응하여야 한다.", "page": 10, "section": "Ⅴ. 계약 조건", "why": "하자보수(3년)와 별도로 2년간 무상 유지보수 의무가 있고, 여기에 하자가 아닌 기능 개선까지 포함되어 사실상 무상 추가 개발이 됩니다.", "extracted_value": null, "threshold": null, "negotiation_point": "무상 의무는 하자보수(통상 1년)로 한정하고, 기능 개선은 별도 유상 유지보수 계약으로 처리한다고 명시해 줄 것을 요구합니다.", "basis": null, "source": "llm"}, {"rule_id": "LLM_unlimited_liability", "title": "손해배상 상한 부재(무한 배상)", "category": "손해배상", "severity": "high", "quote": "상대자는 과업 수행 중 고의 또는 과실로 발주기관에 손해를 끼친 경우 그 모든 손해를 배상하여야 한다.", "page": 11, "section": "15. 계약의 해지", "why": "경과실까지 포함해 배상 상한 없이 '모든 손해'를 배상하도록 되어 있습니다. 간접손해까지 포함되면 배상액이 계약금액을 넘을 수 있습니다.", "extracted_value": null, "threshold": null, "negotiation_point": "손해배상 총액은 계약금액을 상한으로 하고, 간접·결과적 손해는 고의 또는 중과실이 있는 경우를 제외하고 배상에서 뺀다는 조항을 추가할 것을 요구합니다.", "basis": null, "source": "llm"}, {"rule_id": "LLM_03", "title": "지체상금 상한 부재", "category": "지체상금", "severity": "medium", "quote": "지체상금률은 계약금액의 1000분의 2.5로 하며 지체 일수에 곱하여 산정한 금액을 지체상금으로 납부하여야 한다.", "page": 10, "section": "Ⅴ. 계약 조건 1. 지체상금", "why": "지체상금 총액 상한이 없고, 발주기관 귀책(검수 지연, 과업 변경, 외부 연계 지연)에 따른 지체를 면책하는 규정도 없습니다.", "extracted_value": null, "threshold": null, "negotiation_point": "지체상금 총액을 계약금액의 10~30%로 제한하고, 발주기관 또는 제3자 귀책으로 생긴 지체 일수는 산정에서 빼도록 명시한다.", "basis": null, "source": "llm"}, {"rule_id": "LLM_availability_guarantee", "title": "발주처 지정 클라우드 위에서 가동률 99.9% 보장 의무", "category": "성능·SLA", "severity": "medium", "quote": "연간 서비스 가동률 99.9% 이상을 보장하여야", "page": 5, "section": "2. 기능 요구사항", "why": "인프라는 한빛시가 지정하는 공공 클라우드인데, 수행사가 연간 가동률 99.9%(연간 약 8.8시간 이내 중단)를 보장해야 합니다. 이 때문에 CSP 장애나 발주처 귀책으로 생긴 중단까지 수행사 책임이 될 수 있습니다.", "extracted_value": "99.9%", "threshold": null, "negotiation_point": "가동률 산정에서 CSP 인프라 장애, 발주처 귀책 사유, 사전 협의된 계획정지, 천재지변은 제외해 주십시오. 또한 99.9%는 수행사가 '보장'하는 값이 아니라 '설계 목표'로 바꾸고, 시험 기준으로 확인한다는 점을 명시해 주십시오.", "basis": null, "source": "llm"}, {"rule_id": "LLM_privacy_impact_assessment", "title": "개인정보 영향평가 수행 책임의 수행사 전가", "category": "scope", "severity": "medium", "quote": "개인정보 영향평가를 수행하고 개선 권고 사항을 영향평가서\n반영하여야 한다.", "page": 6, "section": "SER-004", "why": "개인정보 영향평가는 개인정보보호위원회가 지정한 평가기관만 수행할 수 있습니다. 수행사가 직접 맡게 되면 외부 평가기관 용역비가 추가로 들고, 개선 권고가 얼마나 나올지 모르는 상태에서 모두 반영해야 하므로 범위가 늘어날 위험이 있습니다.", "extracted_value": null, "threshold": null, "negotiation_point": "개인정보 영향평가는 발주기관이 지정 평가기관과 별도로 계약해 수행하고, 수행사는 자료 제공과 협조만 맡도록 해 주시기 바랍니다. 개선 권고 반영은 계약 범위 안의 항목에 한정하고, 범위를 넘는 항목은 과업 변경 절차로 처리해 주시기 바랍니다.", "basis": null, "source": "llm"}, {"rule_id": "LLM_data_migration_scope", "title": "대규모 데이터 이관의 정제 책임·정합성 기준 불명확", "category": "scope", "severity": "medium", "quote": "12개 기존 시스템의 민원 데이터(약 1,850만", "page": 6, "section": "DAR-002", "why": "12개 기존 시스템에서 약 1,850만 건을 이관해야 하는데, 원천 데이터 오류를 누가 정제하는지와 정합성 합격 기준이 정해져 있지 않습니다. 이 때문에 이관과 검증 공수가 무제한으로 늘어날 수 있습니다.", "extracted_value": null, "threshold": null, "negotiation_point": "원천 데이터 품질 오류의 정제 책임은 발주기관(기존 시스템 운영사)에 두고, 정합성 검증 기준(건수·주요 항목 일치율)과 이관 리허설 횟수를 이관 계획서에서 합의해 확정해 주시기 바랍니다.", "basis": null, "source": "llm"}, {"rule_id": "LLM_STABILIZATION_ONSITE", "title": "오픈 후 3개월 상주 안정화 지원 의무", "category": "범위·비용", "severity": "medium", "quote": "서비스 개시 후 3개월간 상주 안정화 지원을", "page": 9, "section": "Ⅳ. 제안서 작성 및 평가", "why": "오픈 후 3개월 동안 상주 인력을 두어야 하는데, 이 기간의 인력 규모와 대가가 사업비에 반영되는지, 하자보수와 어디까지 구분되는지가 문맥에 없다. 사업 기간이 늘어나거나 인건비가 추가로 들 위험이 있다.", "extracted_value": null, "threshold": null, "negotiation_point": "안정화 기간 상주 인력의 규모와 역할을 명시하고, 그 비용이 사업 예산에 포함되는지, 하자보수 범위와 어떻게 구분되는지 확인해 달라고 질의한다.", "basis": null, "source": "llm"}], "coverage": {"draft_path": "samples/draft_proposal.md", "items": [{"requirement_id": "REQ-P-001", "status": "partial", "evidence_paragraph_ids": ["P-015"], "evidence_quote": "최근 5년간 광역시 2곳", "gap_note": "수행 실적은 있지만 소프트웨어사업자 신고 여부와 각 사업이 공공기관 대상 10억 원 이상인지가 없다."}, {"requirement_id": "REQ-P-002", "status": "missing", "evidence_paragraph_ids": [], "evidence_quote": null, "gap_note": "제안서를 평가 항목 순서대로 작성했다는 점을 밝히고, 각 구현 방안에 대응하는 요구사항 고유번호(예: SFR-001)를 표기해야 한다."}, {"requirement_id": "REQ-P-003", "status": "missing", "evidence_paragraph_ids": [], "evidence_quote": null, "gap_note": "운영에 필요한 상용 소프트웨어 라이선스(보안 솔루션 등)를 사업자가 무상으로 제공한다는 내용을 추가해야 한다."}, {"requirement_id": "REQ-P-004", "status": "missing", "evidence_paragraph_ids": [], "evidence_quote": null, "gap_note": "개인정보 보호법을 준수하고, 개인정보 유출 사고가 나면 원인과 관계없이 계약상대자가 모든 책임을 진다는 내용을 추가해야 한다."}, {"requirement_id": "REQ-P-005", "status": "missing", "evidence_paragraph_ids": [], "evidence_quote": null, "gap_note": "기존 민원 포털과 부서별 시스템의 데이터를 정제까지 포함해 사업자가 전부 책임지고 이관한다는 계획을 추가해야 한다."}, {"requirement_id": "REQ-P-006", "status": "missing", "evidence_paragraph_ids": [], "evidence_quote": null, "gap_note": "모든 사용자 화면이 KWCAG 2.2 웹 접근성 기준을 충족하도록 하는 방안을 추가해야 한다."}, {"requirement_id": "REQ-P-007", "status": "partial", "evidence_paragraph_ids": ["P-006"], "evidence_quote": "처리 현황 대시보드는", "gap_note": "대시보드 기능 설명은 있지만, PC와 모바일에서 같은 기능을 제공한다는 내용이 없다."}, {"requirement_id": "SFR-001", "status": "covered", "evidence_paragraph_ids": ["P-003"], "evidence_quote": "접수번호를 자동 부여한다", "gap_note": null}, {"requirement_id": "SFR-002", "status": "partial", "evidence_paragraph_ids": ["P-003"], "evidence_quote": "추천 정확도 85% 이상을 목표로", "gap_note": "자동 추천과 정확도 85% 이상은 있지만, 추천 결과를 담당자가 확정하는 절차가 빠져 있다."}, {"requirement_id": "SFR-003", "status": "covered", "evidence_paragraph_ids": ["P-004"], "evidence_quote": "단계별 담당자와 처리 시각을 기록한다", "gap_note": null}, {"requirement_id": "SFR-004", "status": "covered", "evidenc 수 있는지가 초안에 없다."}, {"requirement_id": "SIR-002", "status": "covered", "evidence_paragraph_ids": ["P-008"], "evidence_quote": "웹·WAS·DB를 이중화하여", "gap_note": null}, {"requirement_id": "INR-001", "status": "covered", "evidence_paragraph_ids": ["P-009"], "evidence_quote": "정부24에서 신청된 민원을 실시간 수신", "gap_note": null}, {"requirement_id": "INR-002", "status": "covered", "evidence_paragraph_ids": ["P-009"], "evidence_quote": "주민등록등본 등 구비서류를 자동 확인", "gap_note": null}, {"requirement_id": "INR-003", "status": "covered", "evidence_paragraph_ids": ["P-009", "P-006"], "evidence_quote": "REST API 기반 표준 연계 방식", "gap_note": null}, {"requirement_id": "INR-004", "status": "covered", "evidence_paragraph_ids": ["P-009", "P-004"], "evidence_quote": "카카오 알림톡 서비스를 연계", "gap_note": null}, {"requirement_id": "DAR-001", "status": "covered", "evidence_paragraph_ids": ["P-010"], "evidence_quote": "공공데이터 공통표준용어를 따라", "gap_note": null}, {"requirement_id": "DAR-002", "status": "missing", "evidence_paragraph_ids": [], "evidence_quote": null, "gap_note": "12개 기존 시스템의 민원 데이터 약 1,850만 건을 신규 플랫폼으로 이관하는 방법과 정합성 검증 방안을 추가해야 한다."}, {"requirement_id": "DAR-003", "status": "covered", "evidence_paragraph_ids": ["P-010"], "evidence_quote": "분기마다 복구 시험을 실시", "gap_note": null}, {"requirement_id": "TER-001", "status": "missing", "evidence_paragraph_ids": [], "evidence_quote": null, "gap_note": "모든 기능에 대해 단위 테스트와 통합 테스트를 수행하고 결과를 제출하는 계획을 추가해야 한다(P-013의 품질 점검만으로는 테스트 수행이 드러나지 않음)."}, {"requirement_id": "TER-002", "status": "missing", "evidence_paragraph_ids": [], "evidence_quote": null, "gap_note": "부서 담당자가 참여하는 사용자 인수 테스트를 2회 이상 실시하는 계획을 추가해야 한다."}, {"requirement_id": "SER-001", "status": "covered", "evidence_paragraph_ids": ["P-012"], "evidence_quote": "모든 접근 이력을 1년 이상 보관", "gap_note": null}, {"requirement_id": "SER-002", "status": "missing", "evidence_paragraph_ids": [], "evidence_quote": null, "gap_note": "주민등록번호 등 고유식별정보를 안전한 알고리즘으로 암호화해 저장하고, 전송 구간에 TLS 1.2 이상을 적용한다는 내용을 추가해야 한다."}, {"requirement_id": "SER-003", "status": "covered", "evidence_paragraph_ids": ["P-012"], "evidence_quote": "웹 취약점을 점검하고 조치", "gap_note": null}, {"requirement_id": "SER-004", "status": "missing", "evidence_paragraph_ids": [], "evidence_quote": null, "gap_note": "개인정보 영향평가를 수행하고 도출된 개선 권고 사항을 시스템에 반영하는 계획과 일정을 추가해야 한다."}, {"requirement_id": "SER-005", "status": "covered", "evidence_paragraph_ids": ["P-012"], "evidence_quote": "CC 인증 보유 제품으로 구성", "gap_note": null}, {"requirement_id": "QUR-001", "status": "missing", "evidence_paragraph_ids": [], "evidence_quote": null, "gap_note": "주요 민원 신청을 5단계 이내의 화면 이동으로 완료하도록 설계하는 사용성 방안과 검증 방법을 추가해야 한다."}, {"requirement_id": "QUR-002", "status": "partial", "evidence_paragraph_ids": ["P-008"], "evidence_quote": "전자정부 표준프레임워크 4.x", "gap_note": "표준프레임워크 4.x 사용은 나와 있지만 코딩 표준 준수 방법(적용할 표준, 정적 점검 도구, 점검 절차)이 빠져 있다."}, {"requirement_id": "COR-001", "status": "missing", "evidence_paragraph_ids": [], "evidence_quote": null, "gap_note": "민원 처리에 관한 법률, 전자정부법, 개인정보 보호법을 준수하는 방안을 추가해야 한다."}, {"requirement_id": "COR-002", "status": "covered", "evidence_paragraph_ids": ["P-008"], "evidence_quote": "공개 소프트웨어 기반 DBMS", "gap_note": null}, {"requirement_id": "COR-003", "status": "covered", "evidence_paragraph_ids": ["P-008"], "evidence_quote": "통합 인증(SSO) 체계를 그대로", "gap_note": null}, {"requirement_id": "PMR-001", "status": "covered", "evidence_paragraph_ids": ["P-013"], "evidence_quote": "사업수행계획서와 WBS를 제출", "gap_note": null}, {"requirement_id": "PMR-002", "status": "covered", "evidence_paragraph_ids": ["P-013"], "evidence_quote": "주간 진척 보고와 월간 보고회", "gap_note": null}, {"requirement_id": "PMR-003", "status": "covered", "evidence_paragraph_ids": ["P-013"], "evidence_quote": "PMO 점검에 협조한다", "gap_note": null}, {"requirement_id": "PMR-004", "status": "covered", "evidence_paragraph_ids": ["P-013"], "evidence_quote": "위험 등록부를 운영하고", "gap_note": null}, {"requirement_id": "PSR-001", "status": "covered", "evidence_paragraph_ids": ["P-014"], "evidence_quote": "담당자 교육 4회와 관리자 교육 2회", "gap_note": null}, {"requirement_id": "PSR-002", "status": "covered", "evidence_paragraph_ids": ["P-014"], "evidence_quote": "사용자 매뉴얼과 운영자 매뉴얼을 국문으로", "gap_note": null}, {"requirement_id": "PSR-003", "status": "missing", "evidence_paragraph_ids": [], "evidence_quote": null, "gap_note": "'7. 교육 및 지원'에 서비스 개시 후 3개월 동안 상주하며 안정화를 지원하는 계획(투입 인력, 상주 장소, 장애 대응·성능 개선 활동)을 추가해야 한다."}, {"requirement_id": "PSR-004", "status": "covered", "evidence_paragraph_ids": ["P-014"], "evidence_quote": "소스코드, 구성, 장애 대응 절차", "gap_note": null}], "covered": 30, "partial": 5, "missing": 16, "must_missing": 15}}, "pages": {"1": "한빛시 통합민원 플랫폼 고도화 사업\n제안요청서\n2026. 10.\n한빛시 정보화담당관", "2": "Ⅰ. 사업 개요\n1. 사업명\n한빛시 통합민원 플랫폼 고도화 사업\n2. 사업 기간 및 예산\n사업 기간은 계약일로부터 10개월이며, 사업 예산은 2,480백만 원(부가가치세 포함)이다. 사업자는 계약 체결 후 2주\n이내에 착수계와 사업수행계획서를 제출하여야 한다.\n3. 추진 배경\n한빛시는 2017년 구축한 민원 포털과 12개 부서별 민원 처리 시스템을 운영하고 있다. 시스템이 분산되어 민원인은 같은\n서류를 여러 번 제출하고, 담당자는 처리 현황을 수작업으로 취합한다. 2025년 민원 처리 평균 소요일은 6.8일로 광역시\n평균 4.2일보다 길다.\n4. 사업 범위\n본 사업은 다음을 포함한다. 첫째, 민원 접수·처리·통지를 하나의 플랫폼으로 통합한다. 둘째, 정부24·행정정보공동이용 등\n외부 시스템과 연계한다. 셋째, 민원 처리 현황을 실시간으로 보여 주는 대시보드를 구축한다. 넷째, 기존 시스템의 데이터를\n신규 플랫폼으로 이관한다.\n모든 사용자 화면은 한국형 웹 콘텐츠 접근성 지침(KWCAG 2.2) 기준을 충족하여야 한다. 민원 처리 현황 대시보드는\nPC와 모바일 환경에서 동일한 기능을 제공하여야 한다.\n5. 기대 효과\n민원 처리 소요일을 4일 이내로 단축하고, 중복 서류 제출을 없애며, 부서 간 처리 현황을 실시간으로 공유한다.", "3": "Ⅱ. 현황 및 문제점\n1. 정보시스템 현황\n시스템명 구축연도 주요 기능 사용자\n민원 포털 2017 온라인 민원 신청, 진행 조회 시민 48만 명\n부서 민원처리시스템(12종) 2014~2020 부서별 접수·처리 직원 1,200명\n통합 인증(SSO) 2019 직원 인증 직원 1,200명\n문서관리시스템 2016 공문 생산·유통 직원 1,200명\n2. 문제점\n민원 데이터가 12개 시스템에 흩어져 있어 통계 산출에 평균 3일이 걸린다. 외부 기관 자료는 담당자가 수기로 확인한다.\n2019년 이전 시스템은 보안 패치가 중단된 운영체제에서 동작한다.", "4": "Ⅲ. 사업 내용 및 요구사항\n1. 요구사항 총괄\n요구사항은 소프트웨어사업 요구사항 분석·적용 가이드의 분류 체계를 따른다. 사업자는 제안서에 모든 요구사항에 대한\n대응 방안을 요구사항 고유번호 순으로 기술하여야 한다.\n분류 고유번호 건수\n기능 요구사항 SFR 12\n성능 요구사항 PER 3\n시스템 장비구성 요구사항 SIR 2\n인터페이스 요구사항 INR 4\n데이터 요구사항 DAR 3\n테스트 요구사항 TER 2\n보안 요구사항 SER 5\n품질 요구사항 QUR 2\n제약사항 COR 3\n프로젝트 관리 요구사항 PMR 4\n프로젝트 지원 요구사항 PSR 4\n합계 44\n2. 기능 요구사항\n요구사항 요구사항 명칭 정의 세부내용 산출정보\n고유번호\nSFR-001 통합 민원 접수 모든 민원을 하나의 접수 온라인·방문·전화 민원을 단일 접수 화면에서 접수 화면 설계서\n창구에서 받는다 등록하고 접수번호를 자동 부여하여야 한다.\nSFR-002 민원 분류 자동화 민원 내용을 읽어 담당 부서를 민원 신청 내용을 분석하여 담당 부서와 민원 분류 모델 설계서\n추천한다 유형을 자동 추천하고 담당자가 확정하여야 한다.\n추천 정확도는 85% 이상이어야 한다.\nSFR-003 처리 단계 관리 민원 처리 단계를 정의하고 접수·배정·처리·결재·통지 단계를 정의하고 각 프로세스 정의서\n추적한다 단계의 담당자·처리 시각을 기록하여야 한다.\nSFR-004 민원인 알림 처리 단계가 바뀌면 단계 변경 시 문자·카카오 알림톡·이메일 중 알림 설계서\n민원인에게 알린다 민원인이 선택한 채널로 통지하여야 한다.\nSFR-005 서류 재사용 한 번 제출한 서류를 다시 쓴다 민원인이 이전에 제출한 구비서류를 유효기간 내 서류 관리 설계서\n재사용할 수 있어야 하며 재사용 동의 이력을\n남겨야 한다.\nSFR-006 처리 현황 부서별 처리 현황을 한눈에 부서·유형·기간별 접수·처리·지연 건수를 실시간 대시보드 설계서\n대시보드 본다 집계하여 표시하고 지연 민원을 강조하여야 한다.\nSFR-007 담당자 업무함 담당자가 할 일을 모아 본다 담당자별 배정 민원, 기한 임박 민원, 반려 민원을 화면 설계서\n하나의 업무함에서 처리할 수 있어야 한다.\nSFR-008 전자 결재 연동 처리 결과를 결재로 보낸다 민원 처리 결과를 기존 문서관리시스템의 연동 설계서\n전자결재로 상신하고 결재 결과를 자동\n반영하여야 한다.\nSFR-009 통계 및 보고서 민원 통계를 자동 산출한다 월간·분기·연간 민원 통계를 자동 생성하고 통계 정의서\n엑셀·PDF로 내려받을 수 있어야 한다.\nSFR-010 민원인 마이페이지 민원인이 자기 민원을 신청 이력, 진행 상태, 제출 서류, 결과 통지문을 화면 설계서\n관리한다 민원인이 조회·내려받기할 수 있어야 한다.", "5": "요구사항 요구사항 명칭 정의 세부내용 산출정보\n고유번호\nSFR-011 관리자 설정 민원 유형·절차를 관리자가 민원 유형, 처리 단계, 기한, 담당 부서를 코드 변경 관리자 설계서\n바꾼다 없이 관리자 화면에서 설정할 수 있어야 한다.\nSFR-012 다국어 지원 외국인 민원인을 지원한다 민원인 화면은 한국어·영어·중국어·베트남어를 다국어 리소스\n제공하는 것이 바람직하다.\n3. 성능 요구사항\n요구사항 요구사항 명칭 정의 세부내용 산출정보\n고유번호\nPER-001 응답 시간 화면 응답 속도 기준 일반 조회 화면의 평균 응답 시간은 3초 이내여야 성능 시험 결과서\n하며, 통계 화면은 5초 이내여야 한다.\nPER-002 동시 사용자 동시 처리 용량 기준 동시 접속 사용자 2,000명, 시간당 민원 접수 부하 시험 결과서\n5,000건을 처리할 수 있어야 한다.\nPER-003 가용성 서비스 가동률 기준 연간 서비스 가동률 99.9% 이상을 보장하여야 가용성 설계서\n한다.\n4. 시스템 장비구성 요구사항\n요구사항 요구사항 명칭 정의 세부내용 산출정보\n고유번호\nSIR-001 클라우드 기반 공공 클라우드에 구축한다 시스템은 한빛시가 지정하는 공공 클라우드 인프라 구성도\n구성 환경(G-클라우드 또는 민간 CSAP 인증\n클라우드)에 구축하여야 한다.\nSIR-002 이중화 장애 대비 구성 웹·WAS·DB는 이중화하고 단일 장애점이 없도록 인프라 구성도\n구성하여야 한다.", "6": "5. 인터페이스 요구사항\n요구사항 요구사항 명칭 정의 세부내용 산출정보\n고유번호\nINR-001 정부24 연계 정부24 민원 신청 수신 정부24에서 신청된 한빛시 민원을 실시간 연계 정의서\n수신하고 처리 결과를 회신하여야 한다.\nINR-002 행정정보공동이용 구비서류 자동 확인 행정정보공동이용센터 연계로 주민등록등본 등 연계 정의서\n연계 구비서류를 자동 확인하여야 한다.\nINR-003 문서관리시스템 전자결재 연동 기존 문서관리시스템과 표준 연계 방식(ESB 또는 연계 정의서\n연계 REST API)으로 연동하여야 한다.\nINR-004 알림 서비스 연계 문자·알림톡 발송 시 공통 문자 발송 서비스 및 카카오 알림톡 연계 정의서\n서비스와 연계하여야 한다.\n6. 데이터 요구사항\n요구사항 요구사항 명칭 정의 세부내용 산출정보\n고유번호\nDAR-001 데이터 표준화 공통 표준 적용 민원 데이터 항목은 행정안전부 공공데이터 데이터 표준\n공통표준용어를 따라 정의하여야 한다. 정의서\nDAR-002 데이터 이관 기존 데이터 이전 12개 기존 시스템의 민원 데이터(약 1,850만 이관 계획서,\n건)를 신규 플랫폼으로 이관하고 정합성을 검증 결과서\n검증하여야 한다.\nDAR-003 데이터 백업 백업·복구 체계 일 단위 증분 백업과 주 단위 전체 백업을 수행하고 백업 계획서\n복구 시험을 분기마다 실시하여야 한다.\n7. 테스트 요구사항\n요구사항 요구사항 명칭 정의 세부내용 산출정보\n고유번호\nTER-001 단위·통합 테스트 개발 단계 테스트 모든 기능에 대해 단위 테스트와 통합 테스트를 테스트 결과서\n수행하고 결과를 제출하여야 한다.\nTER-002 사용자 인수 현업 검증 부서 담당자가 참여하는 사용자 인수 테스트를 인수 테스트\n테스트 2회 이상 실시하여야 한다. 결과서\n8. 보안 요구사항\n요구사항 요구사항 명칭 정의 세부내용 산출정보\n고유번호\nSER-001 접근 통제 권한 기반 접근 사용자 역할별 접근 권한을 관리하고 모든 접근 권한 설계서\n이력을 1년 이상 보관하여야 한다.\nSER-002 개인정보 암호화 저장·전송 암호화 주민등록번호 등 고유식별정보는 안전한 암호화 설계서\n알고리즘으로 암호화하여 저장하고 전송 구간은\nTLS 1.2 이상을 적용하여야 한다.\nSER-003 보안 취약점 점검 출시 전 점검 주요정보통신기반시설 기술적 취약점 분석·평가 취약점 점검\n기준에 따라 웹 취약점을 점검하고 조치하여야 결과서\n한다.\nSER-004 개인정보 영향평가 영향평가 수행 개인정보 영향평가를 수행하고 개선 권고 사항을 영향평가서\n반영하여야 한다.\nSER-005 보안 솔루션 인증 도입 솔루션 인증 도입하는 보안 솔루션은 CC 인증을 보유하여야 인증서 사본\n한다.\n9. 품질 요구사항", "7": "요구사항 요구사항 명칭 정의 세부내용 산출정보\n고유번호\nQUR-001 사용성 직관적 화면 주요 민원 신청은 5단계 이내의 화면 이동으로 UI 설계서\n완료할 수 있어야 한다.\nQUR-002 유지보수성 표준 준수 소스코드는 전자정부 표준프레임워크 4.x를 코딩 표준 점검\n기반으로 작성하고 코딩 표준을 준수하여야 한다. 결과서", "8": "10. 제약사항\n요구사항 요구사항 명칭 정의 세부내용 산출정보\n고유번호\nCOR-001 법령 준수 관련 법령 준수 민원 처리에 관한 법률, 전자정부법, 개인정보 법령 준수 점검표\n보호법을 준수하여야 한다.\nCOR-002 표준 프레임워크 개발 환경 제약 개발은 전자정부 표준프레임워크와 공개 개발 환경 정의서\n소프트웨어 기반 DBMS를 사용하여야 한다.\nCOR-003 운영 환경 제약 기존 환경 호환 기존 통합 인증(SSO) 체계를 그대로 사용하여야 인증 연동 설계서\n한다.\n11. 프로젝트 관리 요구사항\n요구사항 요구사항 명칭 정의 세부내용 산출정보\n고유번호\nPMR-001 사업 수행 계획 착수 단계 산출물 착수 후 2주 이내 사업수행계획서와 WBS를 사업수행계획서\n제출하고 발주기관의 승인을 받아야 한다.\nPMR-002 진척 보고 정기 보고 주간 진척 보고와 월간 보고회를 실시하여야 한다. 주간·월간 보고서\nPMR-003 품질 보증 품질 활동 단계별 산출물 검토와 품질 점검을 수행하고 품질 점검 결과서\nPMO의 점검에 협조하여야 한다.\nPMR-004 위험 관리 위험 식별·대응 위험 등록부를 운영하고 월간 보고회에서 위험 위험 등록부\n현황을 보고하여야 한다.\n12. 프로젝트 지원 요구사항\n요구사항 요구사항 명칭 정의 세부내용 산출정보\n고유번호\nPSR-001 사용자 교육 교육 실시 담당자 교육 4회, 관리자 교육 2회를 실시하고 교육 계획서,\n교육 자료를 제공하여야 한다. 교육 자료\nPSR-002 운영 매뉴얼 매뉴얼 제공 사용자 매뉴얼과 운영자 매뉴얼을 국문으로 매뉴얼\n작성하여 제공하여야 한다.\nPSR-003 안정화 지원 오픈 후 지원 서비스 개시 후 3개월간 상주 안정화 지원을 안정화 보고서\n수행하여야 한다.\nPSR-004 기술 이전 운영 인력 기술 이전 운영 인력에게 소스코드·구성·장애 대응 절차에 기술 이전 결과서\n대한 기술 이전을 수행하여야 한다.\n13. 기타 사항\n사업자는 요구사항 추적표를 작성하여 설계·구현·테스트 산출물과 요구사항의 연결 관계를 관리하여야 한다. 산출물은\n전자정부 표준 산출물 양식을 따르는 것을 권장한다.", "9": "Ⅳ. 제안서 작성 및 평가\n1. 제안서 작성 지침\n제안서는 A4 규격 100쪽 이내로 작성한다. 제안서는 본 제안요청서의 평가 항목 순서에 따라 작성하며, 요구사항 대응\n여부를 요구사항 고유번호로 표기한다. 제출된 제안서는 반환하지 아니하며 제안에 소요된 비용은 제안사가 부담한다.\n2. 입찰 참가 자격\n입찰 참가 자격은 소프트웨어사업자 신고를 마치고 최근 5년 이내 10억 원 이상 공공기관 정보시스템 구축 실적 2건 이상을\n보유한 업체로 한다. 공동수급은 2개사 이내로 허용한다.\n3. 평가 방법\n기술평가 90점과 가격평가 10점을 합산하여 협상적격자를 선정한다. 기술평가 점수가 배점의 85% 미만인 제안은 협상\n대상에서 제외한다.\n4. 기술평가 배점표\n평가 항목 세부 항목 배점 평가 기준\n사업 이해도 및 전략 사업 이해도 5 사업 배경·현황·문제점 이해의 정확성\n사업 이해도 및 전략 추진 전략 5 목표 달성을 위한 전략의 타당성\n기술 및 기능 기능 요구사항 구현 15 기능 요구사항 대응의 충실성과 구체성\n기술 및 기능 시스템 아키텍처 10 클라우드 구성, 이중화, 확장성\n기술 및 기능 데이터 및 연계 10 데이터 이관 계획과 외부 연계 방안\n성능 및 보안 성능·안정성 7 응답 시간·동시 사용자·가용성 확보 방안\n성능 및 보안 보안 8 개인정보 보호, 접근 통제, 취약점 대응\n사업 관리 수행 조직 및 일정 8 투입 인력의 적정성과 일정의 현실성\n사업 관리 품질 보증 및 위험 관리 7 품질 활동 계획과 위험 대응\n지원 교육 및 기술 이전 5 교육 계획과 기술 이전 방안\n지원 유지보수 및 하자보수 5 안정화 지원과 하자보수 체계\n수행 실적 및 역량 유사 사업 실적 5 최근 5년 유사 사업 수행 실적\n합계 90", "10": "Ⅴ. 계약 조건\n1. 지체상금\n계약상대자가 계약 기간 내에 과업을 완료하지 못한 경우 지체상금률은 계약금액의 1000분의 2.5로 하며 지체 일수에\n곱하여 산정한 금액을 지체상금으로 납부하여야 한다. 지체상금은 대금에서 공제할 수 있다.\n2. 하자보수 및 유지보수\n하자보수 기간은 검수 완료일로부터 3년으로 한다. 또한 계약상대자는 검수 완료 후 2년간 무상 유지보수를 제공하여야\n하며 이 기간 중 기능 개선 요청에 대응하여야 한다.\n3. 과업 내용의 변경\n발주기관이 필요하다고 인정하는 경우 과업 내용을 추가 또는 변경할 수 있으며 계약상대자는 이에 따라야 한다.\n4. 지식재산권\n본 사업의 모든 산출물에 대한 지식재산권은 발주기관에 귀속된다. 계약상대자는 산출물을 발주기관의 사전 서면 동의 없이\n제3자에게 제공할 수 없다.\n5. 손해배상\n계약상대자는 과업 수행 중 고의 또는 과실로 발주기관에 손해를 끼친 경우 그 모든 손해를 배상하여야 한다.\n6. 계약보증금\n계약보증금은 계약금액의 10%로 하며 계약 체결 시 납부한다.\n7. 대금 지급\n사업비는 최종 검수 완료 후 일괄 지급하며 선금은 지급하지 아니한다.\n8. 검수\n검수는 발주기관이 만족할 때까지 반복 수행하며 검수 기간은 계약 기간에 포함된다.\n9. 투입 인력\n참여 인력의 교체는 불가하며 전 인력은 사업 기간 동안 발주기관에 상주하여야 한다.\n10. 상용 소프트웨어\n운영에 필요한 상용 소프트웨어 라이선스는 사업자가 무상으로 제공한다.\n11. 개인정보 보호\n계약상대자는 개인정보 보호법을 준수하여야 하며 개인정보 유출 사고 발생 시 원인을 불문하고 모든 책임은 계약상대자가\n부담한다.\n12. 서비스 수준\n서비스 개시 후 안정화 기간 중 일반 조회 화면의 평균 응답 시간이 3초를 초과하는 월에는 해당 월 대금의 5%를 감액한다.\n13. 외부 연계\n외부 연계 기관의 비협조로 연계 구축이 지연되더라도 그 책임은 사업자가 부담한다.\n14. 데이터 이관\n기존 시스템 데이터 이관은 데이터 정제를 포함하여 전체를 사업자가 책임지고 수행한다.", "11": "15. 계약의 해지\n발주기관은 사정에 따라 언제든지 계약을 해지할 수 있으며 이 경우 기투입 비용은 보상하지 아니한다.", "12": "Ⅵ. 추진 일정\n구분 일정 비고\n제안요청서 공고 2026. 10. 26. 나라장터\n제안서 제출 마감 2026. 11. 16. 18:00 전자 제출\n기술평가 2026. 11. 20. 제안 발표 20분\n협상 및 계약 2026. 11. 말\n사업 착수 2026. 12. 초 계약일로부터 10개월\n제안 발표는 사업 책임자가 직접 수행하여야 한다. 문의는 한빛시 정보화담당관 정보시스템팀으로 한다."}};
const STAGES = [["parse","파싱","PDF → 페이지·표·섹션"],["extract","요구사항 추출","표 + 본문 숨은 요구사항"],["toc","배점·목차","배점표 → 목차 초안"],["risk","위험 조항","규칙 20개 + LLM"],["coverage","커버리지","초안 ↔ 요구사항"],["export","산출물","xlsx · docx · html"]];
const CAT = {SFR:"기능",PER:"성능",SIR:"장비구성",INR:"인터페이스",DAR:"데이터",TER:"테스트",SER:"보안",QUR:"품질",COR:"제약",PMR:"사업관리",PSR:"지원"};
const OB = {must:"필수",should:"권고",may:"선택"}, SEV={high:"높음",medium:"보통",low:"낮음"}, ST={covered:"충족",partial:"부분",missing:"누락"};
let report=null, pages={}, jobId=null, t0=null, timerH=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function initSteps(){$("#steps").innerHTML=STAGES.map((s,i)=>`<div class="step" id="st-${s[0]}"><div class="n">${i+1}단계</div><div class="name">${s[1]}</div><div class="st">대기</div><div class="bar"><i></i></div><div class="muted" style="font-size:11px;margin-top:4px">${s[2]}</div></div>`).join("");}
function setStep(stage,status,done,total){const el=$("#st-"+stage);if(!el)return;el.className="step "+(status==="running"?"running":status==="done"||status==="reused"?"done":status==="skipped"?"skipped":"");el.querySelector(".st").textContent={running:total?`진행 ${done}/${total}`:"진행 중",done:"완료",reused:"완료(재사용)",skipped:"건너뜀(초안 없음)"}[status]||status;if(status==="running"&&total)el.querySelector(".bar i").style.width=Math.round(100*done/total)+"%";}
function startTimer(){t0=performance.now();timerH=setInterval(()=>{const s=(performance.now()-t0)/1000;$("#timer").textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${(s%60).toFixed(1).padStart(4,"0")}`;},100);}
function stopTimer(){clearInterval(timerH);}

async function startJob(form,url){$("#intake").classList.add("hidden");$("#progress").classList.remove("hidden");$("#results").classList.add("hidden");initSteps();startTimer();
  const r=await fetch(url,{method:"POST",body:form});if(!r.ok){$("#log").textContent="실행 실패: "+await r.text();stopTimer();return;}
  jobId=(await r.json()).job_id;const es=new EventSource(`/api/jobs/${jobId}/events`);
  es.onmessage=async e=>{const ev=JSON.parse(e.data);if(ev.type==="stage")setStep(ev.stage,ev.status,ev.done,ev.total);
    else if(ev.type==="done"){es.close();stopTimer();$("#log").textContent=`LLM 모드 ${ev.llm_mode} · 호출 ${ev.llm_calls}회 · 토큰 ${ev.tokens[0]}/${ev.tokens[1]}`;report=await (await fetch(`/api/jobs/${jobId}/report`)).json();pages=await (await fetch(`/api/jobs/${jobId}/pages`)).json();render();}
    else if(ev.type==="error"){es.close();stopTimer();$("#log").innerHTML=`<span class="alert">${esc(ev.message)}</span>`;}};
}
$("#pdf").onchange=e=>$("#pdfName").textContent=e.target.files[0]?.name||"";
$("#draft").onchange=e=>$("#draftName").textContent=e.target.files[0]?.name||"";
$("#run").onclick=()=>{const f=new FormData();const p=$("#pdf").files[0];if(!p){$("#hint").textContent="PDF를 먼저 선택하세요";return;}f.append("pdf",p);if($("#draft").files[0])f.append("draft",$("#draft").files[0]);startJob(f,"/api/jobs");};
$("#sample").onclick=async()=>{const s=await (await fetch("/api/samples")).json();const f=new FormData();f.append("pdf",s.pdfs[0]);if($("#withDraft").checked&&s.drafts[0])f.append("draft",s.drafts[0]);startJob(f,"/api/jobs/sample");};

function render(){const s=report.summary;$("#mode").textContent="LLM: "+s.llm_mode;$("#results").classList.remove("hidden");$("#rfpTitle").textContent=s.title||"RFP";
  $("#tiles").innerHTML=[["요구사항",s.requirement_count,`표 ${s.requirement_table} · 본문 ${s.requirement_prose} · 필수 ${s.requirement_must}`],["위험 조항",s.risk_count,`높음 ${s.risk_high} · 보통 ${s.risk_medium} · 낮음 ${s.risk_low}`,s.risk_high>0?"red":""],["배점 항목",s.scoring_count,`합계 ${s.scoring_points}점 → 목차 ${s.toc_count}장`],["미연결 요구사항",s.unmapped_count,"배점 항목에 연결되지 않음"],
    s.coverage_covered==null?["커버리지","—","초안 없음"]:["필수 누락",s.coverage_must_missing,`충족 ${s.coverage_covered} · 부분 ${s.coverage_partial} · 누락 ${s.coverage_missing}`,s.coverage_must_missing>0?"red":""]].map(t=>`<div class="tile ${t[3]||""}"><div class="k">${t[0]}</div><div class="v">${t[1]}</div><div class="d">${t[2]}</div></div>`).join("");
  $("#downloads").innerHTML=jobId?["xlsx","docx","json"].map(k=>`<a class="btn" href="/api/jobs/${jobId}/download/${k}">${{xlsx:"요구사항 추적표 .xlsx",docx:"목차 초안 .docx",json:"report.json"}[k]}</a>`).join(""):`<span class="muted">오프라인 대시보드 · 산출물은 같은 폴더의 traceability.xlsx / toc_draft.docx</span>`;
  renderReq();renderRisk();renderToc();renderCov();
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");["req","risk","toc","cov"].forEach(k=>$("#pane-"+k).classList.toggle("hidden",k!==t.dataset.tab));});
}
let reqFilter={source:"all",cat:"all",q:""};
function renderReq(){const reqs=report.requirements;const cats=[...new Set(reqs.map(r=>r.category))];
  const cov={};(report.coverage?.items||[]).forEach(i=>cov[i.requirement_id]=i);
  const list=reqs.filter(r=>(reqFilter.source==="all"||r.source===reqFilter.source)&&(reqFilter.cat==="all"||r.category===reqFilter.cat)&&(!reqFilter.q||(r.id+r.title+r.quote).includes(reqFilter.q)));
  $("#pane-req").innerHTML=`<div class="filters">${["all","table","prose"].map(k=>`<span class="chip ${reqFilter.source===k?"on":""}" data-src="${k}">${{all:"전체",table:"표",prose:"본문(숨은 요구사항)"}[k]}</span>`).join("")}
    <select id="catSel"><option value="all">모든 분류</option>${cats.map(c=>`<option value="${c}" ${reqFilter.cat===c?"selected":""}>${c} ${CAT[c]||""}</option>`).join("")}</select>
    <input type="search" id="reqQ" placeholder="검색" value="${esc(reqFilter.q)}"><span class="muted">${list.length}건</span></div>
    <div style="max-height:560px;overflow:auto"><table><thead><tr><th>ID</th><th>요구사항</th><th>분류</th><th>필수</th><th>원문</th><th>쪽</th><th>출처</th>${report.coverage?"<th>커버리지</th>":""}</tr></thead><tbody>
    ${list.map(r=>`<tr class="clickable" data-page="${r.page}" data-q="${esc(r.quote)}" data-t="${esc(r.id+" "+r.title)}"><td><b>${r.id}</b></td><td>${esc(r.title)}</td><td><span class="badge b-cat">${r.category} ${CAT[r.category]||""}</span></td><td><span class="badge b-${r.obligation}">${OB[r.obligation]}</span></td><td class="quote">${esc(r.quote)}${r.flags?.length?`<div class="muted">⚠ ${r.flags.join(", ")}</div>`:""}</td><td>p.${r.page}</td><td><span class="badge b-${r.source}">${r.source==="table"?"표":"본문"}</span></td>${report.coverage?`<td>${cov[r.id]?`<span class="badge b-${cov[r.id].status}">${ST[cov[r.id].status]}</span>`:""}</td>`:""}</tr>`).join("")}</tbody></table></div>`;
  $("#pane-req").querySelectorAll(".chip").forEach(c=>c.onclick=()=>{reqFilter.source=c.dataset.src;renderReq();});
  $("#catSel").onchange=e=>{reqFilter.cat=e.target.value;renderReq();};$("#reqQ").oninput=e=>{reqFilter.q=e.target.value;renderReq();};
  bindRows("#pane-req");
}
function bindRows(sel){document.querySelectorAll(sel+" tr.clickable").forEach(tr=>tr.onclick=()=>openPage(+tr.dataset.page,tr.dataset.q,tr.dataset.t));}
function renderRisk(){const rs=report.risks;if(!rs.length){$("#pane-risk").innerHTML='<p class="muted">위험 조항이 없다.</p>';return;}
  $("#pane-risk").innerHTML=`<p class="muted">규칙이 "어디"를 찾고 LLM이 "왜·얼마나"를 보강한다. 판정: 규칙+LLM = 확정, LLM 단독 = 검토 권고.</p>`+rs.map(f=>`<div class="risk ${f.severity}"><div class="head"><span class="badge b-${f.severity}">${SEV[f.severity]}</span><b>${esc(f.title)}</b><span class="muted">${esc(f.category)} · p.${f.page} · ${esc(f.section||"")}</span><span class="badge b-cat" style="margin-left:auto">${{rule:"규칙",["rule+llm"]:"규칙+LLM","llm":"LLM"}[f.source]}</span></div>
    <blockquote class="clickable" onclick="openPage(${f.page},${JSON.stringify(f.quote).replace(/"/g,"&quot;")},${JSON.stringify(f.title).replace(/"/g,"&quot;")})">“${esc(f.quote)}”</blockquote>
    ${f.extracted_value||f.threshold?`<div class="vals">${f.extracted_value?`<div class="val bad">추출값<b>${esc(f.extracted_value)}</b></div>`:""}${f.threshold?`<div class="val">기준값<b>${esc(f.threshold)}</b></div>`:""}</div>`:""}
    <div>${esc(f.why)}</div><div class="neg">협상 포인트 · ${esc(f.negotiation_point)}</div>${f.basis?`<div class="muted" style="margin-top:4px">근거: ${esc(f.basis)}</div>`:""}</div>`).join("");}
function renderToc(){const t=report.toc;if(!t||!t.toc.length){$("#pane-toc").innerHTML=`<p class="alert">배점표를 찾지 못했다 (${(t?.flags||[]).join(", ")})</p>`;return;}
  const pts={};t.scoring.forEach(c=>pts[c.id]=c);const maxP=Math.max(...t.scoring.filter(c=>!c.parent).map(c=>c.points),1);
  $("#pane-toc").innerHTML=`<p class="muted">심사위원은 배점표 순서로 읽는다. 제안서 총 ${t.total_pages}쪽을 배점 비중대로 배분했다. ${t.flags.length?"⚠ "+t.flags.join(", "):""}</p><div class="toc">
  ${t.toc.map(n=>{const p=n.criterion_ids.map(id=>pts[id]).filter(c=>c&&(!c.parent||!n.criterion_ids.includes(c.parent))).reduce((a,c)=>a+c.points,0);const l2=n.number.includes(".");
   return `<div class="node ${l2?"l2":""}"><div class="num">${n.number}</div><div><b>${esc(n.title)}</b><div class="guide">${esc(n.writing_guide)}</div>${n.requirement_ids.length?`<div class="ids">${n.requirement_ids.join(", ")}</div>`:""}</div><div><div class="muted">배점 ${p}점</div><div class="ptsbar"><i style="width:${Math.round(100*p/maxP)}%"></i></div></div><div><b>${n.suggested_pages}쪽</b><div class="muted">${n.requirement_ids.length}건</div></div></div>`;}).join("")}</div>`;}
function renderCov(){const c=report.coverage;if(!c){$("#pane-cov").innerHTML='<p class="muted">제안서 초안이 없어 커버리지를 대조하지 않았다. 초안(.md/.docx)을 함께 올리면 요구사항별 충족·부분·누락을 판정한다.</p>';return;}
  const by={};report.requirements.forEach(r=>by[r.id]=r);const tot=c.items.length||1;const order={missing:0,partial:1,covered:2};
  const items=[...c.items].sort((a,b)=>order[a.status]-order[b.status]||((by[b.requirement_id]?.obligation==="must")-(by[a.requirement_id]?.obligation==="must")));
  $("#pane-cov").innerHTML=`${c.must_missing?`<div class="alert">필수 요구사항 ${c.must_missing}건이 초안에 없다.</div>`:""}
   <div class="cov-bars"><div class="c" style="width:${100*c.covered/tot}%">충족 ${c.covered}</div><div class="p" style="width:${100*c.partial/tot}%">부분 ${c.partial}</div><div class="m" style="width:${100*c.missing/tot}%">누락 ${c.missing}</div></div>
   <div style="max-height:520px;overflow:auto"><table><thead><tr><th>판정</th><th>ID</th><th>요구사항</th><th>필수</th><th>근거 문단</th><th>근거 / 보완 메모</th></tr></thead><tbody>
   ${items.map(it=>{const r=by[it.requirement_id]||{};return `<tr class="clickable" data-page="${r.page||1}" data-q="${esc(r.quote||"")}" data-t="${esc(it.requirement_id)}"><td><span class="badge b-${it.status}">${ST[it.status]}</span></td><td><b>${it.requirement_id}</b></td><td>${esc(r.title||"")}</td><td>${r.obligation?`<span class="badge b-${r.obligation}">${OB[r.obligation]}</span>`:""}</td><td class="muted">${(it.evidence_paragraph_ids||[]).join(", ")}</td><td>${esc(it.evidence_quote||"")}${it.gap_note?`<div class="muted">${esc(it.gap_note)}</div>`:""}</td></tr>`;}).join("")}</tbody></table></div>`;
  bindRows("#pane-cov");}
function openPage(p,q,title){const text=pages[String(p)]||"(페이지 텍스트 없음)";$("#dTitle").textContent=title||"";$("#dMeta").textContent=`RFP 원문 p.${p}`;
  let html=esc(text);if(q){const norm=s=>s.replace(/\s+/g,"");const nq=norm(q).slice(0,40);const nt=norm(text);const idx=nt.indexOf(nq);
    if(idx>=0){let count=0,start=-1,end=-1;for(let i=0;i<text.length;i++){if(!/\s/.test(text[i])){if(count===idx)start=i;if(count===idx+nq.length-1){end=i+1;break;}count++;}}
      if(start>=0&&end>start)html=esc(text.slice(0,start))+"<mark>"+esc(text.slice(start,end))+"</mark>"+esc(text.slice(end));}}
  $("#dText").innerHTML=html;$("#drawer").classList.add("open");setTimeout(()=>$("#drawer mark")?.scrollIntoView({block:"center"}),50);}
function closeDrawer(){$("#drawer").classList.remove("open");}
(async function boot(){if(EMBEDDED){report=EMBEDDED.report;pages=EMBEDDED.pages||{};$("#intake").classList.add("hidden");render();return;}
  try{const s=await (await fetch("/api/samples")).json();$("#mode").textContent="LLM: "+s.llm_mode;if(!s.pdfs.length)$("#sample").disabled=true;}catch(e){$("#mode").textContent="오프라인";}})();
</script>
</body>
</html>
