name: Deploy site to GitHub Pages

on:
  push:
    branches: [main, "claude/blissful-cannon-tlwwn2"]
    paths: ["scripts/**", "docs/**", "out/sample_rfp_real/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site
        run: python scripts/build_site.py --report out/sample_rfp_real
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
